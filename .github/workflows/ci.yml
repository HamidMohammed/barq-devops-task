name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Python syntax
        run: python -m compileall app validate.py failure_test.py

      - name: Compose config
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d
